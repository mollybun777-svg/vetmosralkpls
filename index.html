<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wishlist</title>
<style>
:root{
 --bg:#09080c;--panel:#141117;--panel2:#1b151e;--ink:#eee5eb;
 --muted:#a99aa8;--accent:#b58aa8;--line:#382b39;--wine:#57283f;
}
*{box-sizing:border-box}
body{
 margin:0;color:var(--ink);
 background:
  radial-gradient(ellipse at 50% -12%,#432438 0%,transparent 42%),
  radial-gradient(ellipse at 0% 55%,#201322 0%,transparent 35%),
  var(--bg);
 font-family:Georgia,"Times New Roman",serif;
 min-height:100vh;
}
header{padding:62px 20px 36px;text-align:center}
.tiny{letter-spacing:.34em;text-transform:uppercase;font:10px Arial,sans-serif;color:#b99aaa}
h1{font-size:clamp(42px,8vw,72px);font-weight:400;margin:17px 0 10px;letter-spacing:.04em;text-shadow:0 0 24px #9b527766}
header p{font:13px Arial,sans-serif;color:var(--muted);letter-spacing:.04em}
.wrap{max-width:1050px;margin:auto;padding:0 20px 60px}
.note{max-width:660px;margin:0 auto 34px;padding:15px 19px;border:1px solid var(--line);border-radius:3px;background:#120f15cc;text-align:center;font:12px/1.7 Arial,sans-serif;color:#c0b1bd}
.tabs{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:0 0 27px}
.tabs button{border:1px solid var(--line);background:#151119;color:#c2b2bf;padding:10px 16px;cursor:pointer;font:11px Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;transition:.2s}
.tabs button:hover,.tabs button.active{background:#49263d;color:#fff;border-color:#87536f;box-shadow:0 0 15px #7a3e6250}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.card{background:linear-gradient(160deg,#1b151e,#100e13);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 12px 30px #0008;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:#76506a}
.pic{height:205px;background:radial-gradient(circle at 50% 45%,#45283e,#1b1420 65%,#100d13);display:grid;place-items:center;color:#d0a9c1;font-size:42px;position:relative;overflow:hidden}
.pic:after{content:"";position:absolute;inset:10px;border:1px solid #8c607344;pointer-events:none;z-index:2}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic span.soon{font:9px Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;position:absolute;bottom:17px;color:#b69aaa;z-index:2;background:#100d13b8;padding:2px 6px;border-radius:2px}
.body{padding:18px;display:flex;flex-direction:column;gap:10px;flex:1}
.category{font:9px Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#c18eaa}
h2{font-size:21px;font-weight:400;margin:0;line-height:1.25}
.desc{font:12px/1.6 Arial,sans-serif;color:var(--muted);margin:0;min-height:38px}
.actions{display:flex;gap:8px;margin-top:auto;padding-top:7px}
a.link,.reserve{flex:1;text-align:center;text-decoration:none;padding:11px 8px;font:11px Arial,sans-serif;letter-spacing:.04em}
a.link{border:1px solid #493849;color:#d8c7d3;background:#17121a}
a.link:hover{border-color:#87536f;color:#fff}
a.link.disabled{opacity:.65;pointer-events:none}
.reserve{border:1px solid #70445f;background:#49263d;color:#fff;cursor:pointer}
.reserve:hover{background:#63354f}
.reserve:disabled{background:#29232b;border-color:#39303b;color:#938591;cursor:default}
.status{font:10px Arial,sans-serif;color:#b6a4b2;min-height:13px}
footer{text-align:center;color:#806e7d;font:10px Arial,sans-serif;letter-spacing:.18em;padding:24px}
@media(max-width:520px){header{padding-top:44px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.pic{height:145px}.body{padding:12px}h2{font-size:17px}.actions{flex-direction:column}}
</style>
</head>
<body>
<header>
 <div class="tiny">✦✦✦✦✦✦✦✦✦✦✦</div>
 <h1>wishlist ♡</h1>
</header>
<main class="wrap">
 <div class="note">Если хочешь подарить что-то из списка — нажми «Забронировать».</div>
 <nav class="tabs" aria-label="Категории">
  <button data-filter="manga">Манга</button>
  <button data-filter="figures">Фигурки</button>
  <button data-filter="other">Прочее</button>
 </nav>
 <section class="grid" id="items"></section>
</main>
<script>
const gifts = [
 {id:"punpun",cat:"manga",label:"Манга",title:"Спокойной ночи, Пунпун",desc:"начиная со 2-й части",image:"https://i.ibb.co/ynrJZ2sg/OIP.webp",alt:"Обложка второго тома манги Спокойной ночи, Пунпун: маленький белый персонаж стоит в пустынном розово-красном пейзаже под зелёным небом. На обложке читаются GOODNIGHT PUNPUN, На добраніч, Пунпун, номер 2 и имя Асано Инио. Контрастные цвета создают меланхоличное, тревожное настроение.",url:"https://book-ye.com.ua/khudozhnya-literatura/komiksy/manga/dobranich-punpune-chastyna-2/?q=%D0%BF%D1%83%D0%BD%D0%BF%D1%83%D0%BD",symbol:"☾"},
 {id:"another",cat:"manga",label:"Манга",title:"Иная",desc:"манга «Иная» (Another).",image:"https://i.ibb.co/Q3sHn5Lp/photo-2026-11-23-21-01-29.jpg",alt:"Обложка манги Иная, также известной как Another. Иллюстрация и текст на обложке не описаны.",url:"https://www.pulsar.ua/ru/products/manga-inaya-another-tom-1/",symbol:"♣"},
 {id:"saya",cat:"figures",label:"Фигурки",title:"фигурка по Saya no Uta",desc:"любая фигурка с Саей.",image:"https://i.ibb.co/0RRXQFP3/photo-2026-11-23-16-43-01.jpg",alt:"Коллаж с персонажем Саей из Saya no Uta. Девушка с длинными тёмно-зелёными волосами и в белом платье стоит лицом к зрителю; рядом показан крупный план её лица. На заднем плане — тёмный фантастический лес в красно-коричневых тонах. Внизу написано saya. Спокойный облик героини контрастирует с тревожной атмосферой.",symbol:"♡"},
 {id:"rei",cat:"figures",label:"Фигурки",title:"Аянами Рей",desc:"любая фигурка Рей.",image:"https://i.ibb.co/qLGkWwrS/photo-2026-11-23-16-43-58.jpg",alt:"Информационный коллаж о Рей Аянами из Neon Genesis Evangelion. На нескольких кадрах Рей с голубыми волосами смотрит задумчиво; внизу по центру изображена её фигурка в чёрном костюме. На тёмном фоне написано Рей Аянами и Персонаж. Внизу указано, что она Первое Дитя и пилот прототипа Евангелион-00. Коллаж выдержан в сдержанных тёмных тонах.",symbol:"✧"},
 {id:"anime",cat:"figures",label:"Фигурки",title:"Аниме-фигурки",desc:"секси аниме тяночки любые",image:"https://i.ibb.co/Fb68v3yV/photo-2026-11-23-20-46-55.jpg",alt:"Скриншот двух карточек интернет-магазина с аниме-фигурками. Слева — фигурка Токисаки Куруми в чёрном платье рядом с коробкой; справа — девушка с розовыми волосами, крыльями и хвостом в чёрно-розовом наряде. На карточках читаются TOMY, Choice, Суперпозиції 20 см, Чорна п’ятниця, Фігурка Tokisaki Kurumi з аніме и Аніме My Dress-Up Darling Кітагава Марін. Указаны цены грн.366.59 и грн.381.90, а также скидки и доставка. Белый фон и яркие баннеры создают вид распродажного каталога.",symbol:"♠"},
 {id:"flowerknows",cat:"other",label:"Прочее",title:"Хайлайтер Flower Knows (L04)",desc:"",image:"https://i.ibb.co/8D88bm7S/photo-2026-11-23-16-40-37.jpg",alt:"Косметика Flower Knows на светлом фоне. В центре открытая круглая пудреница с зеркалом и рельефной светлой пудрой; вокруг лежат закрытые розовые и тёмные футляры с орнаментом и синими деталями. На упаковках читается Flower Knows. Нарядная композиция оформлена в изящном сказочном стиле.",url:"https://a.aliexpress.com/_ExUt5Ny",symbol:"✿"},
 {id:"chokers",cat:"other",label:"Прочее",title:"Чокеры",desc:"Какие-нибудь прикольные чокеры",image:"https://i.ibb.co/KpdyV5f7/photo-2026-11-24-09-38-23.jpg",alt:"Скриншот четырёх карточек интернет-магазина с чокерами: чёрно-белые кружевные колье, розовый чокер с подвесками, набор чёрных чокеров с кольцами и ремешками, а также тонкий чёрный чокер со звездой на модели в тёмной одежде. На красных баннерах написано Чорна п’ятниця; рядом указаны цены в гривнах. Белые карточки и яркие распродажные баннеры создают вид онлайн-каталога.",symbol:"♢"},
 {id:"nyuroki",cat:"other",label:"Прочее",title:"ньюроки",desc:"40",image:"https://i.ibb.co/4nbDybM7/M-TANK120-NSHLACE-S1-jpg.webp",alt:"Пара чёрных кожаных ботинок на массивной платформе стоит на белом фоне. Обувь украшена шнурками, металлическими люверсами и заклёпками; на шнурках есть мелкие белые надписи, которые невозможно уверенно прочитать. Ботинки сняты крупным планом, без других предметов вокруг.",url:"https://www.metalshop.com.ua/p/117412-vzuttia-new-rock-italiiskyi-nehro-m-tank120nshlace-s1/",symbol:"✧"},
 {id:"easter-egg",cat:"other",label:"Прочее",title:"ПАСХАЛКА",desc:"zxcursed",image:"https://i.ibb.co/k6yqzkQ3/kursed-zxcursed-3-1024x801.webp",alt:"Молодой человек стоит по колено в воде в помещении и держит перед собой телефон. На его одежде заметен рисунок котлеты; у левого края видна мокрая улыбающаяся маска в аниме-стиле. Тёмная обстановка и странные детали создают мрачное, тревожное настроение.",url:"https://www.instagram.com/zxcursed",symbol:"✦"}
];
const root=document.getElementById("items");
let filter="all";
function render(){
 root.innerHTML="";
 gifts.filter(g=>filter==="all"||g.cat===filter).forEach(g=>{
  const card=document.createElement("article");card.className="card";

  const picContent = g.image
    ? `<img src="${g.image}" alt="${g.alt || g.title}" onerror="this.remove();this.parentElement.insertAdjacentHTML('afterbegin','${g.symbol}<span class=\\'soon\\'>photo coming soon</span>')">`
   : `${g.symbol}<span class="soon">photo coming soon</span>`;

  const linkHTML = g.url
   ? `<a class="link" href="${g.url}" target="_blank" rel="noopener noreferrer">Открыть ссылку</a>`
   : `<a class="link disabled" href="#" onclick="return false" aria-disabled="true">Ссылка скоро</a>`;

  card.innerHTML=`<div class="pic">${picContent}</div>
   <div class="body"><div class="category">${g.label}</div><h2>${g.title}</h2><p class="desc">${g.desc || ""}</p>
   <div class="actions">${linkHTML}<button class="reserve" type="button">Забронировать</button></div>
   <div class="status" aria-live="polite">Пока свободно</div></div>`;
  card.querySelector(".reserve").addEventListener("click",()=>{
   alert("Это пока макет сайта. Когда подключим общую базу, бронь будет видна всем посетителям.");
  });
  root.appendChild(card);
 });
}
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{
 document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));
 b.classList.add("active");filter=b.dataset.filter;render();
}));
render();
</script>
</body>
</html>
